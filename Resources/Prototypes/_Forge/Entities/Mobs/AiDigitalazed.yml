# ══════════════════════════════════════════════════════════
# Душегуб — ядро станционного ИИ Tel-Adi (КПБ) для переноса сознания.
# Полноценный ИИ (камеры, глаз, прыжок к ядру), НО БЕЗ ЗАКОНОВ.
# Пустое ядро пока оператор не подключится через SoulkillerConnector.
# ══════════════════════════════════════════════════════════

# Мозг Душегуба — копия StationAiBrain, НО без законов
# (убраны SiliconLawProvider, SiliconLawBound, ActionViewLaws и SiliconLaws-UI).
# Eye/ContentEye/InputMover/Access/Alerts/тег StationAi обязательны —
# без них нет ока ИИ, движения и работающих действий.
- type: entity
  parent: StationAiBrain
  id: StationAiBrainDigitalazed
  name: Око
  categories: [ HideSpawnMenu, DoNotMap ]
  components:
  - type: Sprite
  - type: SiliconLawProvider
    laws: VesselLawset


- type: entity
  parent: PlayerStationAiEmpty
  id: MobAiDigitalazed
  name: Пустая система переноса сознания
  description: Автономное ядро искусственного интеллекта. Через коннектор борг может перенести свое сознание в это ядро.
  components:
  - type: Soulkiller
    brainProto: StationAiBrainDigitalazed
    defaultDigitizedName: "Оцифрованная личность"
  - type: ContainerComp
    proto: AiHeldVessel
    container: station_ai_mind_slot
  - type: StationAiCore
    remoteEntityProto: StationAiHolo
  - type: DeviceLinkSink
    ports:
    - SoulkillerLink
  - type: Sprite
    sprite: Mobs/Silicon/station_ai.rsi
    layers:
    - state: base
    - state: ai
      shader: unshaded
  - type: ApcPowerReceiver
    powerLoad: 8000
    needsPower: true
